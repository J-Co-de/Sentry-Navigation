services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: valhalla
    ports:
      - "8002:8002"
    volumes:
      # Relative path avoids problems with spaces in "Web Projects\Sentry Navigation"
      - ./routing-valhalla:/custom_files
    command: build_tiles
    environment:
      # Defined (empty) so configure_valhalla.sh never hits "tile_urls: unbound variable"
      tile_urls: ""
      # Serve the existing pre-built tiles instead of rebuilding on every start
      force_rebuild: "False"
      use_tiles_ignore_pbf: "True"
      # Keep elevation support (elevation_data/ is already present in the volume)
      build_elevation: "True"
      build_tar: "True"
      serve_tiles: "True"
      update_existing_config: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_transit: "False"
      use_default_speeds_config: "True"
    restart: unless-stopped
