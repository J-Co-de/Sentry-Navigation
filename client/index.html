<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentry Navigation</title>
    <meta
      name="description"
      content="Baseplate for Safety Navigation project"
    />
    <link href="/src/general.css" rel="stylesheet" />
    <link href="/src/map-ui.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <div id="search-card" class="search-card">
        <div id="input" class="input">
          <input type="text" placeholder="Search places / addresses" />
          <button class="search">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m21 21-4.34-4.34" />
              <circle cx="11" cy="11" r="8" />
            </svg>
          </button>
          <button class="directions">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="3 11 22 2 13 21 11 13 3 11" />
            </svg>
          </button>
        </div>
        <div id="output" class="output">
          <ul>
            
          </ul>
        </div>
      </div>
      <div id="map" class="map"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
